backend:
  name: github
  repo: Aleksandr1786/monolit
  branch: main
  base_url: https://timely-pavlova-cd7b47.netlify.app
  auth_endpoint: auth

media_folder: "public/images/portfolio"
public_folder: "/images/portfolio"

collections:
  - name: "projects"
    label: "Проекты"
    folder: "src/data/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Название"
        name: "title"
        widget: "string"
      - label: "Категория"
        name: "category"
        widget: "select"
        options:
          - { label: "Эхо классики", value: "classic" }
          - { label: "Честная фактура", value: "industrial" }
          - { label: "Тишина и воздух", value: "minimal" }
      - label: "Изображение"
        name: "image"
        widget: "image"
      - label: "Описание"
        name: "description"
        widget: "text"
      - label: "Дата"
        name: "date"
        widget: "datetime"